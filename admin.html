<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Auto Bill Support</title><link rel="stylesheet" href="/styles.css"></head><body class="page-shell"><div id="login" class="admin-login"><div class="brand">AutoBill <span>Pro</span>✦</div><h1>Quản lý hỗ trợ</h1><p class="status">Đăng nhập để xem và trả lời khách hàng.</p><form id="loginForm"><input id="password" class="field" type="password" placeholder="Mật khẩu admin" autocomplete="current-password"><button class="btn btn-primary" style="width:100%">Đăng nhập</button><div id="loginError" class="error"></div></form></div><div id="app" class="admin-shell" hidden><div class="admin-card"><div class="admin-layout"><aside class="conversation-list" id="list"></aside><section class="admin-chat"><div class="admin-top"><div><div id="chatName" class="chat-title">Chọn một cuộc trò chuyện</div><div id="chatStatus" class="status">Các tin nhắn được giữ tối đa 24 giờ.</div></div><button id="logout" class="btn btn-ghost">Đăng xuất</button></div><div id="messages" class="messages"><div class="empty-state">Chọn khách hàng bên trái để bắt đầu.</div></div><form id="composer" class="composer"><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><button type="button" class="icon-btn" id="attach">＋</button><textarea id="text" rows="1" placeholder="Trả lời khách hàng..."></textarea><button class="btn btn-primary">Gửi</button></form></section></div></div></div><script src="/admin.js"></script></body></html>
