name = "auto-bill-chat-cleanup"
main = "cleanup-worker.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "auto-bill-chat"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "CHAT_FILES"
bucket_name = "auto-bill-chat-files"
