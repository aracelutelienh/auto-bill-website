<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hỗ trợ — Auto Bill</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="page-shell">
  <div class="chat-page">
    <div class="chat-card">
      <div class="chat-head">
        <div class="chat-brand-wrap">
          <a class="brand" href="/">AutoBill <span>Pro</span>✦</a>
          <div class="chat-sub">Hỗ trợ trực tuyến · Hãy nhắn tin và chờ phản hồi !</div>
        </div>
        <button id="nameEdit" class="chat-name" type="button" title="Nhấn để đổi tên">Khách hàng <span>✎</span></button>
      </div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="composer" class="composer">
        <textarea id="text" rows="1" placeholder="Nhập tin nhắn... · Enter để gửi · Shift+Enter xuống dòng" autocomplete="off"></textarea>
        <button class="btn btn-primary send-btn" type="submit">Gửi <span>→</span></button>
      </form>
    </div>
  </div>
  <script src="/support.js"></script>
</body>
</html>
